<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gayza Express Admin Panel</title>
  <link rel="stylesheet" href="gab.css">
  <link rel="stylesheet" href="admin-panel.css">
  <link rel="stylesheet" href="gcash-addon.css">
</head>

<body>
  <main class="container wide admin-page" id="container">

    <!-- ADMIN SIGN IN -->
    <section id="loginBox">
      <h1>Admin Login</h1>
      <p class="subtitle">AsicarnateExpress staff only</p>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your admin email" autocomplete="email" required>

        <label for="loginPass">Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPass" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="togglePass">Show</button>
        </div>

        <button type="submit" class="main-btn" id="loginBtn">Sign In</button>
      </form>
    </section>

    <!-- ADMIN PANEL (id kept as "dashboard" so admin.js keeps working) -->
    <section id="dashboard" hidden>
      <h1>📦 Admin Panel</h1>
      <p id="welcome" class="subtitle">Welcome!</p>

      <!-- stat cards (filled by admin.js) -->
      <div id="adminStats" class="stats"></div>

      <!-- revenue chart + calendar -->
      <div class="ap-grid">
        <div class="ap-card">
          <div class="ap-card-head">
            <h2>Total Revenue</h2>
            <span class="ap-total" id="revTotal"></span>
          </div>
          <div id="revChart" class="rev-chart"></div>
        </div>

        <div class="ap-side">
          <div class="ap-card">
            <div class="cal-head">
              <button type="button" class="cal-nav" id="calPrev" aria-label="Previous week">&#8249;</button>
              <span id="calTitle"></span>
              <button type="button" class="cal-nav" id="calNext" aria-label="Next week">&#8250;</button>
            </div>
            <div class="cal-days" id="calDays"></div>
          </div>

          <div class="ap-card growth">
            <div>
              <h3>Order completion</h3>
              <p id="completionSub">0 of 0 orders completed</p>
            </div>
            <div class="ring" id="completionRing"><span>0%</span></div>
          </div>
        </div>
      </div>

      <h2 class="section-title">Orders</h2>

      <div class="admin-toolbar">
        <select id="adminFilter" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="pending">Finding driver</option>
          <option value="accepted">Driver assigned</option>
          <option value="ontheway">On the way</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <input type="search" id="adminSearch" placeholder="Search order no., name, phone, address" autocomplete="off">
        <button type="button" class="ghost-btn small" id="adminRefresh">Refresh</button>
      </div>

      <div id="adminList"></div>

      <button type="button" class="ghost-btn" id="logoutBtn">Log Out</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="admin-extras.js"></script>
  <script src="gcash-addon.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
