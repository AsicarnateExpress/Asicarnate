<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver</title>
  <link rel="stylesheet" href="gab.css">
  <link rel="stylesheet" href="gcash.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    /* Driver map (new) */
    .map-panel { margin: 12px 0; }
    .map-panel .route-map { height: 320px; margin-top: 8px; }
    .map-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .map-head h2 { margin: 0; font-size: 16px; }
    .map-info { font-size: 13px; margin: 8px 0 0; }
    .map-panel .admin-actions { flex-wrap: wrap; }
    .map-panel .admin-actions a.ghost-btn { text-decoration: none; text-align: center; }
    .map-legend { font-size: 12px; opacity: .8; margin: 4px 0 0; }
    .emoji-pin { background: none; border: 0; font-size: 28px; line-height: 28px; text-align: center;
                 filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  </style>
</head>
<body>
  <div class="container" id="container">

    <section id="loginBox">
      <h1>Driver Login</h1>
      <p class="subtitle">Sign in to take deliveries</p>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
        <label for="loginPass">Password</label>
        <div class="password-wrap">
          <input id="loginPass" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="togglePass">Show</button>
        </div>
        <button class="main-btn" id="loginBtn" type="submit">Sign In</button>
      </form>
    </section>

    <section id="app" hidden>
      <h1>Driver</h1>
      <p class="subtitle" id="welcome"></p>
      <div class="stats" id="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>
      <!-- Map: shows where the client (pick-up) is -->
      <div class="map-panel" id="mapPanel" hidden>
        <div class="map-head">
          <h2 id="mapTitle">Map</h2>
          <button class="ghost-btn small" id="mapCloseBtn" type="button">Close map</button>
        </div>
        <div id="driverMap" class="route-map"></div>
        <p class="map-legend">📍 Client pick-up &nbsp; 🏁 Drop-off &nbsp; 🛵 You</p>
        <p class="map-info" id="mapInfo"></p>
        <div class="admin-actions">
          <button class="ghost-btn small" id="mapLocateBtn" type="button">My location</button>
          <a class="ghost-btn small" id="mapNavBtn" href="#" target="_blank" rel="noopener" hidden>🧭 Navigate to client</a>
          <a class="ghost-btn small" id="mapNavDropBtn" href="#" target="_blank" rel="noopener" hidden>🏁 Navigate to drop-off</a>
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="jobs" type="button">Jobs</button>
        <button class="tab" data-tab="mine" type="button">My trips</button>
        <button class="tab" data-tab="remit" type="button">Remit</button>
      </div>
      <div id="jobs"></div>
      <div id="mine" hidden></div>
      <div id="remit" hidden></div>
      <div class="admin-actions">
        <button class="ghost-btn small" id="refreshBtn" type="button">Refresh</button>
        <button class="ghost-btn small" id="logoutBtn" type="button">Log out</button>
      </div>
    </section>

    <p id="message"></p>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="driver.js?v=3"></script>
</body>
</html>
